name: Verify production edge
description: Validates prod tfvars guardrails, cleans orphan Front Door routes, and smoke-tests www TLS + /api/health.
inputs:
  production_hostname:
    description: Public www hostname (e.g. www.dibangops.com).
    required: false
    default: www.dibangops.com
  tfvars_path:
    description: Path to terraform.prod.tfvars for guardrail validation (relative to repo root).
    required: false
    default: Infrastructure/terraform.prod.tfvars
  skip_tfvars_validation:
    description: Set true when tfvars file is not present (frontend-only job).
    required: false
    default: 'false'
  skip_orphan_cleanup:
    description: Set true to skip deleting legacy orphan API routes.
    required: false
    default: 'false'
  skip_azure_binding_check:
    description: Set true when Azure CLI is not logged in.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate production tfvars guardrails
      if: inputs.skip_tfvars_validation != 'true'
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${GITHUB_WORKSPACE}"
        chmod +x "${ROOT}/scripts/validate-terraform-prod-tfvars.sh"
        "${ROOT}/scripts/validate-terraform-prod-tfvars.sh" "${ROOT}/${{ inputs.tfvars_path }}"

    - name: Remove orphan unified Front Door API route
      if: inputs.skip_orphan_cleanup != 'true'
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${GITHUB_WORKSPACE}"
        chmod +x "${ROOT}/scripts/cleanup-unified-front-door-orphans.sh"
        "${ROOT}/scripts/cleanup-unified-front-door-orphans.sh"

    - name: Verify Azure custom domain route binding
      if: inputs.skip_azure_binding_check != 'true'
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${GITHUB_WORKSPACE}"
        chmod +x "${ROOT}/scripts/verify-unified-front-door-azure.sh"
        HOST="${{ inputs.production_hostname }}"
        CUSTOM_DOMAIN_NAME="$(echo "${HOST}" | tr '.' '-')"
        "${ROOT}/scripts/verify-unified-front-door-azure.sh" crimeportal-rg crimeportal-frontend-unified-fd crimeportal-frontend-unified-ep crimeportal-frontend-unified-spa-route "${CUSTOM_DOMAIN_NAME}" "${HOST}"

    - name: Smoke-test www TLS and API health
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${GITHUB_WORKSPACE}"
        chmod +x "${ROOT}/scripts/verify-production-edge.sh"
        "${ROOT}/scripts/verify-production-edge.sh" "${{ inputs.production_hostname }}"
