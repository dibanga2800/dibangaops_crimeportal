# Full stack: Terraform (bootstrap + release), container images, and Static Web App.
# For day-to-day work use:
#   - Deploy Frontend (.github/workflows/deploy-frontend.yml) for AIP_UI-only changes → prod-v2 (green)
#   - Deploy Backend (.github/workflows/deploy-backend.yml) for AIP_Backend changes → prod-v2 (green)
#
# target_environment routes Terraform state, tfvars secret, and resource group:
#   prod            — legacy crimeportal-rg (public SQL, www.dibangops.com today)
#   prod-v2         — green crimeportal-prod-v2-rg (private SQL from birth; blue/green cutover)
#   phase1-scratch  — throwaway rehearsal RG (optional; same Terraform graph as prod-v2)

name: Deploy Full Stack

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment to deploy to
        required: true
        default: prod
        type: choice
        options:
          - prod
          - prod-v2
          - phase1-scratch

permissions:
  id-token: write
  contents: read

# One deploy at a time so two workflows do not fight over the same remote state lease.
# Include the target environment in the group so prod and scratch can run independently.
concurrency:
  group: crimeportal-terraform-deploy-${{ github.ref }}-${{ github.event.inputs.target_environment || 'prod' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERRAFORM_VERSION: '1.13.4'
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  BACKEND_IMAGE_NAME: 'crimeportal-backend'
  AI_IMAGE_NAME: 'crimeportal-ai'
  # Public www hostname for post-deploy TLS/API smoke tests (override via repository variable PRODUCTION_WWW_HOSTNAME).
  PRODUCTION_WWW_HOSTNAME: ${{ vars.PRODUCTION_WWW_HOSTNAME || 'www.dibangops.com' }}
  # Target environment routing. Defaults to 'prod' when triggered without an input
  # (e.g. via the API). Use 'phase1-scratch' for the parallel pre-prod RG.
  TARGET_ENV: ${{ github.event.inputs.target_environment || 'prod' }}
  IS_SCRATCH: ${{ github.event.inputs.target_environment == 'phase1-scratch' }}
  IS_PROD_V2: ${{ github.event.inputs.target_environment == 'prod-v2' }}
  IS_LEGACY_PROD: ${{ github.event.inputs.target_environment == 'prod' }}
  TARGET_RESOURCE_GROUP: ${{ github.event.inputs.target_environment == 'phase1-scratch' && 'crimeportal-phase1-scratch-rg' || (github.event.inputs.target_environment == 'prod-v2' && 'crimeportal-prod-v2-rg' || 'crimeportal-rg') }}
  TF_VAR_resource_group: ${{ github.event.inputs.target_environment == 'phase1-scratch' && 'crimeportal-phase1-scratch-rg' || (github.event.inputs.target_environment == 'prod-v2' && 'crimeportal-prod-v2-rg' || 'crimeportal-rg') }}
  STRICT_PROD_EDGE: ${{ github.event.inputs.target_environment == 'prod' && 'true' || 'false' }}

jobs:
  terraform-bootstrap:
    name: Terraform Apply (Bootstrap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Infrastructure

    outputs:
      acr_name: ${{ steps.tf-output.outputs.acr_name }}
      acr_login_server: ${{ steps.tf-output.outputs.acr_login_server }}
      backend_url: ${{ steps.tf-output.outputs.backend_url }}
      key_vault_name: ${{ steps.tf-output.outputs.key_vault_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard scratch target requires scratch-only secrets
        if: env.IS_SCRATCH == 'true'
        env:
          SCRATCH_TFVARS: ${{ secrets.TERRAFORM_PHASE1_SCRATCH_TFVARS }}
          SCRATCH_STATE_KEY: ${{ secrets.TF_STATE_KEY_SCRATCH }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${SCRATCH_TFVARS}" ]; then missing+=("TERRAFORM_PHASE1_SCRATCH_TFVARS"); fi
          if [ -z "${SCRATCH_STATE_KEY}" ]; then missing+=("TF_STATE_KEY_SCRATCH"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::target_environment=phase1-scratch requires the following secrets to be set: ${missing[*]}. See Infrastructure/README.md (Blue/green and Phase 1)."
            exit 1
          fi
          echo "All required scratch secrets are present."

      - name: Guard prod-v2 target requires v2 secrets
        if: env.IS_PROD_V2 == 'true'
        env:
          V2_TFVARS: ${{ secrets.TERRAFORM_PROD_V2_TFVARS }}
          V2_STATE_KEY: ${{ secrets.TF_STATE_KEY_V2 }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${V2_TFVARS}" ]; then missing+=("TERRAFORM_PROD_V2_TFVARS"); fi
          if [ -z "${V2_STATE_KEY}" ]; then missing+=("TF_STATE_KEY_V2"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::target_environment=prod-v2 requires: ${missing[*]}. See Infrastructure/README.md and docs/blue-green-cutover-runbook.md"
            exit 1
          fi
          echo "All required prod-v2 secrets are present."

      - name: Write terraform.prod.tfvars from secret
        uses: ./.github/actions/write-terraform-prod-tfvars
        with:
          content: ${{ env.IS_SCRATCH == 'true' && secrets.TERRAFORM_PHASE1_SCRATCH_TFVARS || (env.IS_PROD_V2 == 'true' && secrets.TERRAFORM_PROD_V2_TFVARS || secrets.TERRAFORM_PROD_TFVARS) }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate production edge tfvars guardrails
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x scripts/validate-terraform-prod-tfvars.sh
          scripts/validate-terraform-prod-tfvars.sh \
            Infrastructure/terraform.prod.tfvars \
            "${TARGET_RESOURCE_GROUP}" \
            "${STRICT_PROD_EDGE}"

      - name: Verify Terraform state backend exists
        run: |
          set -euo pipefail
          RG="${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          SA="${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          CONTAINER="${{ secrets.TF_STATE_CONTAINER }}"
          if [ -z "${RG}" ] || [ -z "${SA}" ] || [ -z "${CONTAINER}" ]; then
            echo "::error::TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, and TF_STATE_CONTAINER must all be set. See Infrastructure/README.md (Terraform state recovery)."
            exit 1
          fi
          if ! az group show --name "${RG}" >/dev/null 2>&1; then
            echo "::error::TF_STATE_RESOURCE_GROUP '${RG}' was not found in this subscription."
            echo "::error::Legacy crimeportal-rg (and its tfstate storage) was deleted — recover deleted storage in Portal or run scripts/setup-tfstate-backend.ps1, then update TF_STATE_* secrets."
            exit 1
          fi
          if ! az storage account show --resource-group "${RG}" --name "${SA}" >/dev/null 2>&1; then
            echo "::error::Storage account '${SA}' was not found in resource group '${RG}'. Update TF_STATE_STORAGE_ACCOUNT or create the backend (scripts/setup-tfstate-backend.ps1)."
            exit 1
          fi
          echo "Terraform state backend resource group and storage account exist."

      - name: Break orphaned Terraform state blob lease (if any)
        env:
          TF_STATE_KEY_RESOLVED: ${{ env.IS_SCRATCH == 'true' && secrets.TF_STATE_KEY_SCRATCH || (env.IS_PROD_V2 == 'true' && secrets.TF_STATE_KEY_V2 || secrets.TF_STATE_KEY) }}
        run: |
          set -euo pipefail
          SA="${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          RG="${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          CONTAINER="${{ secrets.TF_STATE_CONTAINER }}"
          BLOB="${TF_STATE_KEY_RESOLVED}"
          if ! KEY="$(az storage account keys list --resource-group "${RG}" --account-name "${SA}" --query '[0].value' -o tsv 2>/dev/null)"; then
            echo "::warning::Could not access storage account ${SA} in ${RG}. Skipping lease break — verify TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, and TF_STATE_CONTAINER secrets."
            exit 0
          fi
          az storage blob lease break \
            --blob-name "${BLOB}" \
            --container-name "${CONTAINER}" \
            --account-name "${SA}" \
            --account-key "${KEY}" \
            || true

      - name: Terraform Init
        env:
          TF_STATE_KEY_RESOLVED: ${{ env.IS_SCRATCH == 'true' && secrets.TF_STATE_KEY_SCRATCH || (env.IS_PROD_V2 == 'true' && secrets.TF_STATE_KEY_V2 || secrets.TF_STATE_KEY) }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${TF_STATE_KEY_RESOLVED}"

      - name: Detect existing infrastructure
        id: infra-check
        run: |
          EXISTS="$(az group exists --name "${TARGET_RESOURCE_GROUP}")"
          echo "resource_group_exists=${EXISTS}" >> "$GITHUB_OUTPUT"

      - name: Compute budget start date (current month UTC)
        id: budget-date
        run: echo "value=$(date -u +%Y-%m-01T00:00:00Z)" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply (create infra and ACR)
        if: ${{ steps.infra-check.outputs.resource_group_exists != 'true' || env.IS_PROD_V2 == 'true' || env.IS_SCRATCH == 'true' }}
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
          TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
        run: |
          terraform apply -auto-approve \
            -lock-timeout=10m \
            -var-file="terraform.prod.tfvars" \
            -var="budget_start_date=${{ steps.budget-date.outputs.value }}" \
            -var="backend_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
            -var="ai_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"

      - name: Capture Terraform Outputs
        id: tf-output
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "backend_url=$(terraform output -raw backend_url)" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"

  build-and-push-images:
    name: Build and Push Containers
    runs-on: ubuntu-latest
    needs: terraform-bootstrap

    outputs:
      backend_image: ${{ steps.image-vars.outputs.backend_image }}
      ai_image: ${{ steps.image-vars.outputs.ai_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${{ needs.terraform-bootstrap.outputs.acr_name }}"

      - name: Define image tags
        id: image-vars
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "backend_image=${{ needs.terraform-bootstrap.outputs.acr_login_server }}/${{ env.BACKEND_IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "ai_image=${{ needs.terraform-bootstrap.outputs.acr_login_server }}/${{ env.AI_IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          docker build \
            -f AIP_Backend/Dockerfile \
            -t "${{ steps.image-vars.outputs.backend_image }}" \
            AIP_Backend
          docker push "${{ steps.image-vars.outputs.backend_image }}"

      - name: Build and push AI image
        run: |
          docker build \
            -f AIP_Backend/InsightFaceService/Dockerfile \
            -t "${{ steps.image-vars.outputs.ai_image }}" \
            AIP_Backend/InsightFaceService
          docker push "${{ steps.image-vars.outputs.ai_image }}"

  terraform-release:
    name: Terraform Apply (Release Images)
    runs-on: ubuntu-latest
    needs: [terraform-bootstrap, build-and-push-images]
    defaults:
      run:
        working-directory: Infrastructure

    outputs:
      backend_url: ${{ steps.tf-output.outputs.backend_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write terraform.prod.tfvars from secret
        uses: ./.github/actions/write-terraform-prod-tfvars
        with:
          content: ${{ env.IS_SCRATCH == 'true' && secrets.TERRAFORM_PHASE1_SCRATCH_TFVARS || (env.IS_PROD_V2 == 'true' && secrets.TERRAFORM_PROD_V2_TFVARS || secrets.TERRAFORM_PROD_TFVARS) }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate production edge tfvars guardrails
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x scripts/validate-terraform-prod-tfvars.sh
          scripts/validate-terraform-prod-tfvars.sh \
            Infrastructure/terraform.prod.tfvars \
            "${TARGET_RESOURCE_GROUP}" \
            "${STRICT_PROD_EDGE}"

      - name: Verify Terraform state backend exists
        run: |
          set -euo pipefail
          RG="${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          SA="${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          CONTAINER="${{ secrets.TF_STATE_CONTAINER }}"
          if [ -z "${RG}" ] || [ -z "${SA}" ] || [ -z "${CONTAINER}" ]; then
            echo "::error::TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, and TF_STATE_CONTAINER must all be set. See Infrastructure/README.md (Terraform state recovery)."
            exit 1
          fi
          if ! az group show --name "${RG}" >/dev/null 2>&1; then
            echo "::error::TF_STATE_RESOURCE_GROUP '${RG}' was not found in this subscription."
            echo "::error::Legacy crimeportal-rg (and its tfstate storage) was deleted — recover deleted storage in Portal or run scripts/setup-tfstate-backend.ps1, then update TF_STATE_* secrets."
            exit 1
          fi
          if ! az storage account show --resource-group "${RG}" --name "${SA}" >/dev/null 2>&1; then
            echo "::error::Storage account '${SA}' was not found in resource group '${RG}'. Update TF_STATE_STORAGE_ACCOUNT or create the backend (scripts/setup-tfstate-backend.ps1)."
            exit 1
          fi
          echo "Terraform state backend resource group and storage account exist."

      - name: Break orphaned Terraform state blob lease (if any)
        env:
          TF_STATE_KEY_RESOLVED: ${{ env.IS_SCRATCH == 'true' && secrets.TF_STATE_KEY_SCRATCH || (env.IS_PROD_V2 == 'true' && secrets.TF_STATE_KEY_V2 || secrets.TF_STATE_KEY) }}
        run: |
          set -euo pipefail
          SA="${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          RG="${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          CONTAINER="${{ secrets.TF_STATE_CONTAINER }}"
          BLOB="${TF_STATE_KEY_RESOLVED}"
          if ! KEY="$(az storage account keys list --resource-group "${RG}" --account-name "${SA}" --query '[0].value' -o tsv 2>/dev/null)"; then
            echo "::warning::Could not access storage account ${SA} in ${RG}. Skipping lease break — verify TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, and TF_STATE_CONTAINER secrets."
            exit 0
          fi
          az storage blob lease break \
            --blob-name "${BLOB}" \
            --container-name "${CONTAINER}" \
            --account-name "${SA}" \
            --account-key "${KEY}" \
            || true

      - name: Terraform Init
        env:
          TF_STATE_KEY_RESOLVED: ${{ env.IS_SCRATCH == 'true' && secrets.TF_STATE_KEY_SCRATCH || (env.IS_PROD_V2 == 'true' && secrets.TF_STATE_KEY_V2 || secrets.TF_STATE_KEY) }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${TF_STATE_KEY_RESOLVED}"

      - name: Compute budget start date (current month UTC)
        id: budget-date
        run: echo "value=$(date -u +%Y-%m-01T00:00:00Z)" >> "$GITHUB_OUTPUT"

      - name: Ensure Key Vault admin role assignment is in Terraform state
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
          TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          KV_SCOPE="$(az keyvault show \
            --name "${{ needs.terraform-bootstrap.outputs.key_vault_name }}" \
            --resource-group "${TARGET_RESOURCE_GROUP}" \
            --query id -o tsv)"
          SP_OID="$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)"
          RA_ID="$(az role assignment list \
            --assignee "${SP_OID}" \
            --scope "${KV_SCOPE}" \
            --query "[?roleDefinitionName=='Key Vault Administrator'] | [0].id" -o tsv)"

          if [ -z "${RA_ID}" ] || [ "${RA_ID}" = "null" ]; then
            echo "Key Vault Administrator assignment not found for CI SP; creating it now."
            az role assignment create \
              --assignee-object-id "${SP_OID}" \
              --assignee-principal-type ServicePrincipal \
              --role "Key Vault Administrator" \
              --scope "${KV_SCOPE}" >/dev/null
            RA_ID="$(az role assignment list \
              --assignee "${SP_OID}" \
              --scope "${KV_SCOPE}" \
              --query "[?roleDefinitionName=='Key Vault Administrator'] | [0].id" -o tsv)"
          fi

          if [ -z "${RA_ID}" ] || [ "${RA_ID}" = "null" ]; then
            echo "Unable to resolve Key Vault Administrator role assignment ID for CI SP."
            exit 1
          fi

          STATE_RA_ID=""
          if terraform state show azurerm_role_assignment.terraform_kv_admin >/dev/null 2>&1; then
            STATE_RA_ID="$(terraform state show azurerm_role_assignment.terraform_kv_admin | awk -F' = ' '/^\s*id\s*=/{print $2}' | tr -d '"')"
          fi

          if [ "${STATE_RA_ID}" = "${RA_ID}" ]; then
            echo "terraform_kv_admin state already points to CI service principal assignment."
            exit 0
          fi

          if [ -n "${STATE_RA_ID}" ]; then
            echo "Removing stale terraform_kv_admin state (${STATE_RA_ID})."
            terraform state rm azurerm_role_assignment.terraform_kv_admin
          fi

          echo "Importing Key Vault Administrator assignment into Terraform state."
          terraform import -lock-timeout=10m \
            -var-file="terraform.prod.tfvars" \
            -var="budget_start_date=${{ steps.budget-date.outputs.value }}" \
            -var="backend_image=${{ needs.build-and-push-images.outputs.backend_image }}" \
            -var="ai_image=${{ needs.build-and-push-images.outputs.ai_image }}" \
            azurerm_role_assignment.terraform_kv_admin \
            "${RA_ID}"

      # See deploy-backend.yml: avoid -target ACR apply before release; it still refreshes backend.

      - name: Wait for RBAC propagation
        run: sleep 30

      - name: Import existing COOP database into Terraform state
        if: env.IS_LEGACY_PROD == 'true'
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
          TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if terraform state show azurerm_mssql_database.sql_db >/dev/null 2>&1; then
            DB_ID="$(terraform state show azurerm_mssql_database.sql_db | awk -F' = ' '/^\s*id\s*=/{print $2}' | tr -d '"')"
            if [ -n "${DB_ID}" ] && [ "${DB_ID}" != *"/databases/COOP" ]; then
              echo "State still points at old database (${DB_ID}); removing stale SQL database state."
              terraform state rm azurerm_mssql_database.sql_db
            else
              echo "Terraform SQL database state already points to COOP."
            fi
          fi

          if ! terraform state show azurerm_mssql_database.sql_db >/dev/null 2>&1; then
            SQL_SERVER_ID="$(az sql server show \
              --name "crimeportalsql0gf8g" \
              --resource-group "${TARGET_RESOURCE_GROUP}" \
              --query id -o tsv)"
            COOP_DB_ID="${SQL_SERVER_ID}/databases/COOP"
            if az sql db show --ids "${COOP_DB_ID}" --query id -o tsv >/dev/null 2>&1; then
              echo "Importing existing COOP database into Terraform state."
              terraform import -lock-timeout=10m \
                -var-file="terraform.prod.tfvars" \
                -var="budget_start_date=${{ steps.budget-date.outputs.value }}" \
                -var="backend_image=${{ needs.build-and-push-images.outputs.backend_image }}" \
                -var="ai_image=${{ needs.build-and-push-images.outputs.ai_image }}" \
                azurerm_mssql_database.sql_db \
                "${COOP_DB_ID}"
            else
              echo "COOP database does not exist yet; Terraform will create it."
            fi
          fi

      - name: Import existing www Static Web App custom domain into Terraform state
        if: env.IS_LEGACY_PROD == 'true'
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
          TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if terraform state show 'azurerm_static_web_app_custom_domain.frontend_www_custom_domain[0]' >/dev/null 2>&1; then
            echo "frontend_www_custom_domain already in Terraform state."
            exit 0
          fi
          SUB="$(az account show --query id -o tsv)"
          WWW_RESOURCE_ID="/subscriptions/${SUB}/resourceGroups/${TARGET_RESOURCE_GROUP}/providers/Microsoft.Web/staticSites/crimeportal-frontend/customDomains/www.dibangops.com"
          if ! az resource show --ids "${WWW_RESOURCE_ID}" -o none 2>/dev/null; then
            echo "www.dibangops.com custom domain not found in Azure; Terraform will create it on apply."
            exit 0
          fi
          echo "Importing existing www.dibangops.com custom domain into Terraform state."
          terraform import -lock-timeout=10m \
            -var-file="terraform.prod.tfvars" \
            -var="budget_start_date=${{ steps.budget-date.outputs.value }}" \
            -var="backend_image=${{ needs.build-and-push-images.outputs.backend_image }}" \
            -var="ai_image=${{ needs.build-and-push-images.outputs.ai_image }}" \
            'azurerm_static_web_app_custom_domain.frontend_www_custom_domain[0]' \
            "${WWW_RESOURCE_ID}"

      - name: Sync unified Front Door Terraform state (import rule set, drop legacy route)
        if: env.IS_LEGACY_PROD == 'true'
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
          TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ../scripts/sync-unified-front-door-terraform-state.sh
          ../scripts/sync-unified-front-door-terraform-state.sh "${TARGET_RESOURCE_GROUP}" crimeportal-frontend-unified-fd unifiedrouting apiorigingroup \
            -var-file="terraform.prod.tfvars" \
            -var="budget_start_date=${{ steps.budget-date.outputs.value }}" \
            -var="backend_image=${{ needs.build-and-push-images.outputs.backend_image }}" \
            -var="ai_image=${{ needs.build-and-push-images.outputs.ai_image }}"

      - name: Terraform Apply (release images)
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
          TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if terraform apply -auto-approve \
              -lock-timeout=10m \
              -var-file="terraform.prod.tfvars" \
              -var="budget_start_date=${{ steps.budget-date.outputs.value }}" \
              -var="backend_image=${{ needs.build-and-push-images.outputs.backend_image }}" \
              -var="ai_image=${{ needs.build-and-push-images.outputs.ai_image }}"; then
              exit 0
            fi
            echo "Terraform apply (release images) failed (attempt ${attempt}/5); retrying in 45s..."
            sleep 45
          done
          exit 1

      - name: Capture Terraform outputs for smoke tests
        id: tf-output
        run: |
          set -euo pipefail
          echo "backend_url=$(terraform output -raw backend_url)" >> "$GITHUB_OUTPUT"
          echo "backend_container_app_url=$(terraform output -raw backend_container_app_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "unified_fd_host=$(terraform output -raw unified_front_door_endpoint_host 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Wait for Front Door origin propagation (legacy prod only)
        if: env.IS_LEGACY_PROD == 'true'
        run: |
          echo "Allowing 10 minutes for Front Door origin hostname changes to propagate before www verification."
          sleep 600

      - name: Wait for Front Door propagation (green stacks)
        if: env.IS_SCRATCH == 'true' || env.IS_PROD_V2 == 'true'
        run: |
          echo "Allowing 5 minutes for new Front Door endpoint routing to propagate before green smoke tests."
          sleep 300

      - name: Verify production edge (TLS, API health, Front Door binding)
        if: env.IS_LEGACY_PROD == 'true'
        uses: ./.github/actions/verify-production-edge
        env:
          EDGE_VERIFY_ATTEMPTS: '24'
          EDGE_VERIFY_SLEEP_SECONDS: '15'
        with:
          production_hostname: ${{ env.PRODUCTION_WWW_HOSTNAME }}

      - name: Verify green stack ingress (prod-v2 and scratch)
        if: env.IS_SCRATCH == 'true' || env.IS_PROD_V2 == 'true'
        env:
          BACKEND_URL: ${{ steps.tf-output.outputs.backend_url }}
          CA_BACKEND_URL: ${{ steps.tf-output.outputs.backend_container_app_url }}
          UNIFIED_FD_HOST: ${{ steps.tf-output.outputs.unified_fd_host }}
        run: |
          set -euo pipefail
          smoke_url() {
            local label="$1"
            local base="$2"
            if [ -z "${base}" ]; then
              echo "::warning::${label} URL empty; skipping."
              return 0
            fi
            echo "Smoke-testing ${label} at ${base}/api/health"
            local max_attempts="${3:-12}"
            for attempt in $(seq 1 "${max_attempts}"); do
              HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${base}/api/health" || echo '000')"
              if [ "${HTTP_CODE}" = "200" ]; then
                echo "${label} /api/health returned 200."
                return 0
              fi
              echo "Attempt ${attempt}/${max_attempts}: HTTP ${HTTP_CODE}; retrying in 20s..."
              sleep 20
            done
            echo "::warning::${label} /api/health did not return 200. Inspect Container App / Front Door logs."
            return 1
          }
          FAILED=0
          smoke_url "Container App (direct)" "${CA_BACKEND_URL}" 12 || FAILED=1
          if [ -n "${UNIFIED_FD_HOST}" ] && [ "${UNIFIED_FD_HOST}" != "null" ]; then
            # FD routing often lags behind direct CA health on first green bootstrap; warn only.
            smoke_url "Unified Front Door (*.azurefd.net)" "https://${UNIFIED_FD_HOST}" 24 || true
          elif [ -n "${BACKEND_URL}" ]; then
            smoke_url "Public API URL" "${BACKEND_URL}" 12 || FAILED=1
          fi
          exit "${FAILED}"

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: terraform-release
    if: needs.terraform-release.result == 'success' && github.event.inputs.target_environment != 'phase1-scratch'

    steps:
      - name: Guard prod-v2 frontend requires V2 SWA deployment token
        if: env.IS_PROD_V2 == 'true'
        env:
          V2_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
        run: |
          set -euo pipefail
          if [ -z "${V2_SWA_TOKEN}" ]; then
            echo "::error::target_environment=prod-v2 requires AZURE_STATIC_WEB_APPS_API_TOKEN_V2 (deployment token from crimeportal-frontend-prod-v2). Without it, deploy targets legacy SWA and green shows the default congratulations page."
            exit 1
          fi
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN_V2 is set."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AIP_UI/package-lock.json

      - name: Install dependencies
        working-directory: AIP_UI
        run: npm ci

      - name: Build frontend
        working-directory: AIP_UI
        env:
          VITE_APP_ENV: production
          # Same-origin API via unified Front Door (www.dibangops.com/api). Do not embed Container Apps FQDN.
          VITE_API_BASE_URL: /api
          VITE_IDLE_TIMEOUT_MINUTES: '60'
        run: npm run build:production

      # Copy only Vite output into a clean folder at repo root. The SWA deploy client has been observed
      # validating/packaging AIP_UI (including node_modules) even when app_location pointed at dist; this avoids that.
      - name: Stage Static Web App artifact
        run: |
          set -euo pipefail
          rm -rf swa-publish
          mkdir -p swa-publish
          cp -a AIP_UI/dist/. swa-publish/
          cp AIP_UI/staticwebapp.config.json swa-publish/staticwebapp.config.json
          du -sh swa-publish

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.IS_PROD_V2 == 'true' && secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: swa-publish
          skip_app_build: true

  verify-production-edge:
    name: Verify production edge
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: needs.deploy-frontend.result == 'success' && github.event.inputs.target_environment == 'prod'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for Front Door origin propagation
        run: |
          echo "Allowing 10 minutes for Front Door origin propagation before final www verification."
          sleep 600

      - name: Verify www TLS and /api/health
        uses: ./.github/actions/verify-production-edge
        env:
          EDGE_VERIFY_ATTEMPTS: '24'
          EDGE_VERIFY_SLEEP_SECONDS: '15'
        with:
          production_hostname: ${{ env.PRODUCTION_WWW_HOSTNAME }}
          skip_tfvars_validation: 'true'
