name: Infrastructure Plan

on:
  pull_request:
    paths:
      - 'Infrastructure/**'
      - '.github/workflows/infra-plan.yml'
      - '.github/workflows/deploy-main.yml'
      - '.github/actions/write-terraform-prod-tfvars/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-plan:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Prefer secret TERRAFORM_PLAN_TFVARS (e.g. copy of real prod/dev tfvars) so plan matches deployed config.
      # Without it, the example is used — validate still passes but planned changes may not reflect production.
      - name: Prepare terraform.dev.tfvars for plan
        working-directory: Infrastructure
        env:
          PLAN_TFVARS: ${{ secrets.TERRAFORM_PLAN_TFVARS }}
        run: |
          set -euo pipefail
          if [ -n "${PLAN_TFVARS}" ]; then
            printf '%s\n' "${PLAN_TFVARS}" > terraform.dev.tfvars
          else
            cp terraform.dev.tfvars.example terraform.dev.tfvars
            echo "::warning::TERRAFORM_PLAN_TFVARS unset — using terraform.dev.tfvars.example (plan may diverge from deployed infra)."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (remote backend)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
        run: |
          terraform plan \
            -var-file="terraform.dev.tfvars" \
            -var="backend_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
            -var="ai_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
