# Backend + AI image release only (no Terraform apply, no Key Vault/infra mutation).
# Frontend deploy remains separate in deploy-frontend.yml.

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'AIP_Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: crimeportal-backend-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  BACKEND_IMAGE_NAME: 'crimeportal-backend'
  AI_IMAGE_NAME: 'crimeportal-ai'
  RESOURCE_GROUP: 'crimeportal-rg'
  BACKEND_APP_NAME: 'crimeportal-backend'
  AI_APP_NAME: 'crimeportal-ai'

jobs:
  build-and-push-images:
    name: Build and Push Containers
    runs-on: ubuntu-latest

    outputs:
      backend_image: ${{ steps.image-vars.outputs.backend_image }}
      ai_image: ${{ steps.image-vars.outputs.ai_image }}
      acr_name: ${{ steps.acr_vars.outputs.acr_name }}
      acr_login_server: ${{ steps.acr_vars.outputs.acr_login_server }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and test backend
        working-directory: AIP_Backend
        run: |
          set -euo pipefail
          dotnet restore AIPBackend.sln
          dotnet test AIPBackend.sln -c Release --no-restore --filter "Category!=LocalDatabase"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR details
        id: acr_vars
        run: |
          set -euo pipefail
          ACR_NAME="$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query '[0].name' -o tsv)"
          ACR_LOGIN_SERVER="$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query '[0].loginServer' -o tsv)"
          if [ -z "${ACR_NAME}" ] || [ -z "${ACR_LOGIN_SERVER}" ]; then
            echo "No ACR found in resource group '${{ env.RESOURCE_GROUP }}'."
            exit 1
          fi
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: |
          set -euo pipefail
          ACR_NAME="${{ steps.acr_vars.outputs.acr_name }}"
          if [ -z "${ACR_NAME}" ]; then
            echo "Resolved ACR name is empty. Check Resolve ACR details step output."
            exit 1
          fi
          az acr login --name "${ACR_NAME}"

      - name: Define image tags
        id: image-vars
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          echo "backend_image=${{ steps.acr_vars.outputs.acr_login_server }}/${{ env.BACKEND_IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "ai_image=${{ steps.acr_vars.outputs.acr_login_server }}/${{ env.AI_IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker build --pull \
            -f AIP_Backend/Dockerfile \
            -t "${{ steps.image-vars.outputs.backend_image }}" \
            AIP_Backend
          docker push "${{ steps.image-vars.outputs.backend_image }}"

      - name: Build and push AI image
        run: |
          set -euo pipefail
          docker build --pull \
            -f AIP_Backend/InsightFaceService/Dockerfile \
            -t "${{ steps.image-vars.outputs.ai_image }}" \
            AIP_Backend/InsightFaceService
          docker push "${{ steps.image-vars.outputs.ai_image }}"

  update-container-app-images:
    name: Update Container App Images
    runs-on: ubuntu-latest
    needs: build-and-push-images

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update backend image
        id: update_backend
        run: |
          set -euo pipefail
          BACKEND_LATEST_REVISION="$(az containerapp update \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --image "${{ needs.build-and-push-images.outputs.backend_image }}" \
            --query "properties.latestRevisionName" -o tsv)"
          echo "backend_latest_revision=${BACKEND_LATEST_REVISION}" >> "$GITHUB_OUTPUT"

      - name: Wait for backend revision readiness
        run: |
          set -euo pipefail
          TARGET_REV="${{ steps.update_backend.outputs.backend_latest_revision }}"
          if [ -z "${TARGET_REV}" ]; then
            echo "Backend latest revision was not returned by update step."
            exit 1
          fi

          echo "Waiting for backend revision '${TARGET_REV}' to become ready (single-revision mode: traffic uses this revision automatically when healthy)..."
          for attempt in $(seq 1 30); do
            READY_REV="$(az containerapp show \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "${{ env.BACKEND_APP_NAME }}" \
              --query "properties.latestReadyRevisionName" -o tsv)"

            if [ "${READY_REV}" = "${TARGET_REV}" ]; then
              echo "Backend revision is ready: ${READY_REV}"
              exit 0
            fi

            echo "Attempt ${attempt}/30: latest ready revision is '${READY_REV}', waiting..."
            sleep 10
          done

          echo "Backend revision '${TARGET_REV}' did not become ready in time."
          echo "Revision snapshot:"
          az containerapp revision list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --query "[].{name:name,active:properties.active,runningState:properties.runningState,healthState:properties.healthState,image:properties.template.containers[0].image}" -o table
          echo "Recent logs from target revision:"
          az containerapp logs show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --revision "${TARGET_REV}" \
            --tail 200 || true
          exit 1

      - name: Update AI image
        id: update_ai
        run: |
          set -euo pipefail
          # buffalo_l + ONNX needs more than 1Gi in practice; undersized apps get ActivationFailed / OOM.
          AI_LATEST_REVISION="$(az containerapp update \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AI_APP_NAME }}" \
            --image "${{ needs.build-and-push-images.outputs.ai_image }}" \
            --cpu 1.0 \
            --memory 2.0Gi \
            --query "properties.latestRevisionName" -o tsv)"
          echo "ai_latest_revision=${AI_LATEST_REVISION}" >> "$GITHUB_OUTPUT"

      - name: Wait for AI revision readiness
        run: |
          set -euo pipefail
          TARGET_REV="${{ steps.update_ai.outputs.ai_latest_revision }}"
          if [ -z "${TARGET_REV}" ]; then
            echo "AI latest revision was not returned by update step."
            exit 1
          fi

          echo "Waiting for AI revision '${TARGET_REV}' to become ready..."
          for attempt in $(seq 1 45); do
            READY_REV="$(az containerapp show \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "${{ env.AI_APP_NAME }}" \
              --query "properties.latestReadyRevisionName" -o tsv)"

            if [ "${READY_REV}" = "${TARGET_REV}" ]; then
              echo "AI revision is ready: ${READY_REV}"
              exit 0
            fi

            echo "Attempt ${attempt}/45: latest ready revision is '${READY_REV}', waiting..."
            sleep 10
          done

          echo "AI revision '${TARGET_REV}' did not become ready in time."
          echo "Revision snapshot:"
          az containerapp revision list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AI_APP_NAME }}" \
            --query "[].{name:name,active:properties.active,runningState:properties.runningState,healthState:properties.healthState,image:properties.template.containers[0].image}" -o table
          echo "Recent logs from target revision:"
          az containerapp logs show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AI_APP_NAME }}" \
            --revision "${TARGET_REV}" \
            --tail 200 || true
          exit 1

      - name: Verify running images
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --query "properties.template.containers[0].image" -o tsv
          echo "Backend revision mode / ready revision (single-revision apps have no ingress traffic split):"
          az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --query "{activeRevisionsMode:properties.configuration.activeRevisionsMode,latestReadyRevisionName:properties.latestReadyRevisionName,latestRevisionName:properties.latestRevisionName}" \
            -o json
          az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AI_APP_NAME }}" \
            --query "properties.template.containers[0].image" -o tsv
          echo "AI revision mode / ready revision:"
          az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AI_APP_NAME }}" \
            --query "{activeRevisionsMode:properties.configuration.activeRevisionsMode,latestReadyRevisionName:properties.latestReadyRevisionName,latestRevisionName:properties.latestRevisionName}" \
            -o json
