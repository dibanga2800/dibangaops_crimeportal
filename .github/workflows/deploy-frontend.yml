# Frontend-only: build AIP_UI and deploy to Azure Static Web Apps.
# Does not build container images or run Terraform apply.
#
# Post blue/green cutover, path-triggered pushes target prod-v2 (green stack).
# Production SPA uses same-origin VITE_API_BASE_URL=/api (unified Front Door on www).

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'AIP_UI/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: crimeportal-terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERRAFORM_VERSION: '1.13.4'
  NODE_VERSION: '22'
  PRODUCTION_WWW_HOSTNAME: ${{ vars.PRODUCTION_WWW_HOSTNAME || 'www.dibangops.com' }}
  RESOURCE_GROUP: crimeportal-prod-v2-rg
  BACKEND_APP_NAME: crimeportal-backend-prod-v2
  FD_PROFILE_NAME: crimeportal-frontend-prod-v2-unified-fd
  FD_ENDPOINT_NAME: crimeportal-frontend-prod-v2-unified-ep
  FD_ROUTE_NAME: crimeportal-frontend-prod-v2-unified-spa-route

jobs:
  resolve-api-url:
    name: Resolve API URL
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.final.outputs.backend_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check production API URL secret
        id: from-secret
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: |
          set -euo pipefail
          URL="$(echo "${PRODUCTION_API_BASE_URL}" | tr -d '\r\n' | sed 's:/*$::')"
          if [ -z "${URL}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${URL}" in
            https://*) ;;
            *)
              echo "PRODUCTION_API_BASE_URL must be a full https URL (no trailing path)."
              exit 1
              ;;
          esac
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "backend_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Using PRODUCTION_API_BASE_URL from GitHub secret (skipping Azure login)."

      - name: Setup Terraform
        if: steps.from-secret.outputs.found != 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        if: steps.from-secret.outputs.found != 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        if: steps.from-secret.outputs.found != 'true'
        working-directory: Infrastructure
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY_V2 }}"

      - name: Resolve API URL from Azure
        if: steps.from-secret.outputs.found != 'true'
        id: from-azure
        working-directory: Infrastructure
        run: |
          set -euo pipefail
          FD_URL=""
          if terraform output -raw api_front_door_url > /tmp/api_front_door_url.txt 2>/dev/null; then
            FD_URL="$(tr -d '\r\n' < /tmp/api_front_door_url.txt)"
          fi
          case "${FD_URL}" in
            https://*)
              echo "backend_url=${FD_URL}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          FQDN="$(az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          if [ -z "${FQDN}" ]; then
            echo "Could not resolve Container App ingress FQDN."
            exit 1
          fi
          echo "backend_url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Finalize API URL
        id: final
        run: |
          set -euo pipefail
          if [ "${{ steps.from-secret.outputs.found }}" = "true" ]; then
            echo "backend_url=${{ steps.from-secret.outputs.backend_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend_url=${{ steps.from-azure.outputs.backend_url }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: resolve-api-url

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard prod-v2 frontend requires V2 SWA deployment token
        env:
          V2_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
        run: |
          set -euo pipefail
          if [ -z "${V2_SWA_TOKEN}" ]; then
            echo "::error::prod-v2 frontend deploy requires AZURE_STATIC_WEB_APPS_API_TOKEN_V2."
            exit 1
          fi
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN_V2 is set."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AIP_UI/package-lock.json

      - name: Install dependencies
        working-directory: AIP_UI
        run: npm ci

      - name: Build frontend
        working-directory: AIP_UI
        env:
          VITE_APP_ENV: production
          VITE_API_BASE_URL: /api
          VITE_IDLE_TIMEOUT_MINUTES: '60'
        run: npm run build:production

      - name: Stage Static Web App artifact
        run: |
          set -euo pipefail
          rm -rf swa-publish
          mkdir -p swa-publish
          cp -a AIP_UI/dist/. swa-publish/
          cp AIP_UI/staticwebapp.config.json swa-publish/staticwebapp.config.json
          du -sh swa-publish

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: swa-publish
          skip_app_build: true

  verify-production-edge:
    name: Verify production edge
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify www TLS and /api/health
        uses: ./.github/actions/verify-production-edge
        with:
          production_hostname: ${{ env.PRODUCTION_WWW_HOSTNAME }}
          skip_tfvars_validation: 'true'
          skip_orphan_cleanup: 'true'
          azure_resource_group: ${{ env.RESOURCE_GROUP }}
          fd_profile_name: ${{ env.FD_PROFILE_NAME }}
          fd_endpoint_name: ${{ env.FD_ENDPOINT_NAME }}
          fd_route_name: ${{ env.FD_ROUTE_NAME }}
