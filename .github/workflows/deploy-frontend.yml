# Frontend-only: build AIP_UI and deploy to Azure Static Web Apps.
# Does not build container images or run Terraform apply (resolves API URL from Azure / TF state).

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'AIP_UI/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: crimeportal-terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Run JS-based actions on Node 24 before GitHub’s June 2026 default (Node 20 runner removal Sept 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERRAFORM_VERSION: '1.13.4'
  NODE_VERSION: '20'

jobs:
  resolve-api-url:
    name: Resolve API URL
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: crimeportal-rg
      BACKEND_APP_NAME: crimeportal-backend
    outputs:
      backend_url: ${{ steps.api-url.outputs.backend_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: Infrastructure
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: Capture backend URL
        id: api-url
        working-directory: Infrastructure
        run: |
          set -euo pipefail
          FD_URL=""
          if terraform output -raw api_front_door_url > /tmp/api_front_door_url.txt 2>/dev/null; then
            FD_URL="$(tr -d '\r\n' < /tmp/api_front_door_url.txt)"
          fi
          case "${FD_URL}" in
            https://*)
              echo "backend_url=${FD_URL}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          FQDN="$(az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          if [ -z "${FQDN}" ]; then
            echo "Could not resolve Container App ingress FQDN."
            exit 1
          fi
          echo "backend_url=https://${FQDN}" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: resolve-api-url

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AIP_UI/package-lock.json

      - name: Install dependencies
        working-directory: AIP_UI
        run: npm ci

      - name: Build frontend
        working-directory: AIP_UI
        env:
          VITE_APP_ENV: production
          VITE_API_BASE_URL: ${{ needs.resolve-api-url.outputs.backend_url }}/api
          VITE_IDLE_TIMEOUT_MINUTES: '60'
        run: npm run build:production

      - name: Stage Static Web App artifact
        run: |
          set -euo pipefail
          rm -rf swa-publish
          mkdir -p swa-publish
          cp -a AIP_UI/dist/. swa-publish/
          cp AIP_UI/staticwebapp.config.json swa-publish/staticwebapp.config.json
          du -sh swa-publish

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: swa-publish
          skip_app_build: true
